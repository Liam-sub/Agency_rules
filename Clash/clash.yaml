  - RULE-SET,Spotify,🎬 海外流媒体
  - RULE-SET,PrimeVideo,🎬 海外流媒体
  # ---- 9. 海外其他大厂 ----
  - RULE-SET,Amazon,🏢 海外其他大厂
  - RULE-SET,GitHub,🏢 海外其他大厂
  # ---- 10. AI 服务 ----
  - RULE-SET,Muse,🤖 AI 服务
  - RULE-SET,OpenAI,🤖 AI 服务
  - RULE-SET,Gemini,🤖 AI 服务
  - RULE-SET,Claude,🤖 AI 服务
  - RULE-SET,BardAI,🤖 AI 服务
  # ---- 11. Asn_海外 ----
