
mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'localhost'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'

  # 基础 DNS：使用 IP 地址，避免引导解析依赖 DoH 域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 主 DNS：先使用可直接访问的国内 UDP DNS，避免 Cloudflare DoH 超时
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 代理节点域名解析
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # DIRECT 出站域名解析
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  direct-nameserver-follow-policy: false

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all-proxies: true
    proxies:
      - "♻️ 自动选择"
      - DIRECT
  - name: "♻️ 自动选择"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all-proxies: true
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"
  - name: "🇨🇳 国内直连"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
  - name: "🍎 苹果"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"
  - name: "📺 YouTube"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "📲 Telegram"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🔍 Google"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "Ⓜ️ Microsoft"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - DIRECT
      - "♻️ 自动选择"
  - name: "🌍 海外社交"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🎬 海外流媒体"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🏢 海外其他大厂"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🤖 AI 服务"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🌊 海外Asn"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🐟 兜底"
    type: select
    include-all-proxies: true
    proxies:
      - "🚀 节点选择"
      - DIRECT

